name: Android CI/CD

on:
  push:
    branches: [ main ]

jobs:
  # CI
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' 
          cache-dependency-path: Capture/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Capture

      - name: Run tests
        run: npm run test
        working-directory: Capture

# CD
  deploy:
    name: Build and Deploy to Release
    runs-on: ubuntu-latest
    needs: test 
    permissions:
      contents: write 
    environment:
      name: Production
      url: ${{ steps.create_release.outputs.html_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Capture/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Capture
        
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3 
        with:

          build-root-directory: Capture/android 

      - name: Build Android Release (APK)
        run: ./gradlew :app:assembleRelease --build-cache --parallel
        working-directory: Capture/android 
        
      - name: Create "SNAPSHOT" Version Tag
        id: create_tag
        run: |
          # Creates a unique tag name like "snapshot-20251107-1930-a1b2c3d"
          VERSION_TAG="snapshot-$(date +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          echo "TAG_NAME=$VERSION_TAG" >> $GITHUB_ENV
      
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: "Build (${{ env.TAG_NAME }})"
          body: "Automatic build from commit ${{ github.sha }}."
          draft: false
          prerelease: true 

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Capture/android/app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
