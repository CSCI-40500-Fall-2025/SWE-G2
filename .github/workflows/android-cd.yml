name: Android CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: Capture/node_modules
          key: node-modules-${{ hashFiles('Capture/package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: npm ci
        working-directory: Capture

      - name: Run tests
        run: npm run test
        working-directory: Capture

      - name: Build Android Release (APK) with cache
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: Capture/android
          arguments: :app:assembleRelease --build-cache --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: Capture/android/app/build/outputs/apk/release/app-release.apk
