name: Android CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: Capture/node_modules
          key: node-modules-${{ hashFiles('Capture/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: Capture

      - name: Run tests
        run: npm run test
        working-directory: Capture

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Capture/android/**/*.gradle*', 'Capture/android/gradle/wrapper/gradle-wrapper.properties') }}
      
      - name: Build Android Release
        run: ./gradlew :app:assembleRelease --parallel --build-cache
        working-directory: Capture/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: Capture/android/app/build/outputs/apk/release/app-release.apk
